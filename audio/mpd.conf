# /etc/mpd.conf on boatflix. Music comes straight off the media drive and plays
# through the Daakro Bluetooth receiver via BlueALSA.
music_directory		"/mnt/media/media/Music"
playlist_directory		"/var/lib/mpd/playlists"
db_file			"/var/lib/mpd/tag_cache"
state_file			"/var/lib/mpd/state"
sticker_file                   "/var/lib/mpd/sticker.sql"
user				"mpd"
bind_to_address			"0.0.0.0"
input {
        plugin "curl"
}
decoder {
        plugin                  "hybrid_dsd"
        enabled                 "no"
}
decoder {
        plugin        "wildmidi"
        enabled       "no"
}
# While the receiver is away the PCM doesn't exist; MPD retries the output
# every ~10s while playing, so playback resumes once bt-audio-autoconnect
# brings it back.
audio_output {
    type "alsa"
    name "Boat Audio"
    device "bluealsa:DEV=9C:4E:4E:80:3C:02,PROFILE=a2dp"
    mixer_type "software"
}
filesystem_charset		"UTF-8"
