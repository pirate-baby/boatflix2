# Send audio to audiopi (boat stereo) over the pulse protocol, tcp/4713.
context.modules = [
  { name = libpipewire-module-pulse-tunnel
    args = {
      tunnel.mode = sink
      pulse.server.address = "tcp:audiopi.local:4713"
      reconnect.interval.ms = 5000
      stream.props = {
        node.name = "audiopi"
        node.description = "audiopi (boat stereo)"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
